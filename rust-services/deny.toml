[advisories]
version = 2
yanked = "deny"
# Exceções temporárias: cada uma exige um upgrade que quebra API e por isso é
# tratada em PR próprio, não neste (que apenas introduz o gate). Ver issue de
# remediação (issue #377). Revisar esta lista a cada upgrade — entrada que sobra sem motivo
# esvazia o gate.
ignore = [
  # h2 0.3.27: RUSTSEC-2026-0258 só tem correção em >=0.4.16, e a série 0.3 vem
  # do reqwest 0.11 (rag-worker, ingestion-worker, embedding-service) — sair dela
  # exige subir reqwest para 0.12. O h2 0.4.x já foi atualizado para 0.4.16.
  "RUSTSEC-2026-0258",
  # rustls-webpki 0.101.7: issue #377 upou sqlx para 0.8 (que já resolve para
  # webpki >=0.103), mas 0.101.7 continua no lockfile via uma cadeia
  # independente — rustls 0.21.12, puxado por reqwest 0.11 (hyper-rustls) e
  # pelo aws-sdk-s3/aws-config (usados em ingestion-worker para download do
  # MinIO). A resolução real é o mesmo upgrade de reqwest 0.11 -> 0.12 e
  # aws-sdk-* já referenciado acima para RUSTSEC-2026-0258; não é resolvida
  # apenas pelo upgrade do sqlx como a issue #377 presumia.
  "RUSTSEC-2026-0104",
  "RUSTSEC-2026-0098",
  "RUSTSEC-2026-0099",
  # rsa: sem versão corrigida publicada até hoje (2026-08-17).
  "RUSTSEC-2023-0071",
  # Crates sem manutenção, puxadas transitivamente — sem vulnerabilidade associada.
  "RUSTSEC-2024-0384",
  "RUSTSEC-2024-0436",
  "RUSTSEC-2025-0134",
  # ttf-parser: puxado transitivamente por lopdf 0.42 (upgrade da issue #377,
  # antes não estava no grafo). Autor declarou o crate sem manutenção; sem
  # advisory de vulnerabilidade associada e sem upgrade seguro disponível
  # (RUSTSEC-2026-0192).
  "RUSTSEC-2026-0192",
]

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  # webpki-roots (âncoras de confiança TLS, dependência transitiva de reqwest/sqlx) é a
  # única dependência do workspace sob esta licença — file-level copyleft, sem obrigação
  # de distribuir o código-fonte do projeto que a usa.
  "MPL-2.0",
  # webpki-roots >=0.26 (puxado por sqlx 0.8, issue #377) trocou de MPL-2.0 para esta
  # licença — permissiva, sem cláusula copyleft.
  "CDLA-Permissive-2.0",
]
# Os crates internos do workspace (publish = false) não são publicados, logo
# não têm licença de distribuição a validar.
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
# shared = { path = "../shared" } nos crates do workspace não declara versão
# (não faz sentido pinar versão de um crate irmão no mesmo repo); sem isso o
# cargo-deny trata toda dependência de path como wildcard.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
