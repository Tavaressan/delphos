# docker-compose.ci-runner.yml — 2 runners self-hosted do GitHub Actions
# (myoung34/github-runner), como workaround enquanto o billing do GitHub
# Actions hospedado está bloqueado (ver commit abcc102).
#
# Substitui os containers avulsos (docker run) gh-runner-alfabra,
# gh-runner-alfabra-2 e gh-runner-alfabra-3 por 2 novos, gerenciados via
# compose, com volumes de trabalho novos (build limpo). Autenticação via
# GitHub App (APP_ID + APP_LOGIN + APP_PRIVATE_KEY), suportada nativamente
# pela imagem myoung34/github-runner — troca a private key por um
# installation token internamente a cada (re)registro, sem depender de
# PAT/registration token manual.
#
# Cenário "equilibrado": divide os recursos do Docker Desktop (4 CPU / 11.7GB
# neste host) entre os 2 containers, reservando margem para o Docker
# Desktop/SO e para a stack de aplicação (docker-compose.yml) rodar em
# paralelo se necessário:
#   - 2x runner: 1.5 CPU / 4GB limite cada  =  3 CPU / 8GB total
#   - headroom:                                1 CPU / ~3.7GB livre
#
# Os dois containers usam o mesmo label (alfabra-local, já configurado na
# variável de repo CI_RUNNER_LABELS), então o GitHub distribui os jobs entre
# eles automaticamente conforme disponibilidade — não é preciso configurar
# afinidade job→runner manualmente.
#
# Uso (a private key é PEM multilinha — não cabe bem em .env, então é
# exportada via command substitution a partir do arquivo original):
#   docker rm -f gh-runner-alfabra gh-runner-alfabra-2 gh-runner-alfabra-3
#   docker pull myoung34/github-runner:latest
#   export GH_RUNNER_APP_PRIVATE_KEY="$(cat ~/Desktop/Chaves/alfabra-vector-ci-runner.2026-07-21.private-key.pem)"
#   docker compose -f docker-compose.ci-runner.yml up -d --force-recreate
#   docker compose -f docker-compose.ci-runner.yml logs -f
#   docker compose -f docker-compose.ci-runner.yml down

# Paridade de namespace com o host (issues #347/#353, PRs #354/#356) — os
# runners rodam em container mas usam o daemon Docker do host via docker.sock,
# entao tudo que um job entrega ao daemon e interpretado no namespace do HOST:
#
#   - workdir: bind mount no MESMO caminho dos dois lados. O volume nomeado
#     anterior (runner-work-N:/tmp/runner) nao tem caminho de host que o
#     compose de um job pudesse referenciar — bind mounts como
#     ./infrastructure/postgres/init.sql resolviam para /tmp/runner/... , que
#     nao existe no host, e o Docker criava diretorio vazio no lugar do
#     arquivo ("psql: init.sql: Is a directory").
#   - network_mode: host. Em bridge, as portas que o compose de um job publica
#     (8080, 8000, 3000, 15672) ficam no namespace do host e o "localhost" de
#     dentro do runner e outro — a suite tests/e2e/runner.test.js falhava com
#     "Backend nao ficou pronto" mesmo com o servico no ar.
#
# NAO TESTADO neste host: os runners do Mac estavam offline quando a correcao
# foi escrita (so os da EC2 foram validados). Ao reativa-los, confirme que
# /tmp/gh-runner-work-N esta no file sharing do Docker Desktop e rode o job
# e2e-integration uma vez antes de confiar no gate.

x-runner-common: &runner-common
  image: myoung34/github-runner:latest
  restart: unless-stopped
  cpus: "1.5"
  mem_limit: "4g"
  mem_reservation: "2g"

services:
  gh-runner-alfabra-1:
    <<: *runner-common
    container_name: gh-runner-alfabra-1
    environment:
      REPO_URL: https://github.com/Tavaressan/Alfabra-Vector
      RUNNER_SCOPE: repo
      APP_ID: "4358824"
      APP_LOGIN: Tavaressan
      APP_PRIVATE_KEY: ${GH_RUNNER_APP_PRIVATE_KEY}
      RUNNER_NAME: alfabra-local-mac-1
      RUNNER_WORKDIR: /tmp/gh-runner-work-1
      LABELS: alfabra-local
      AGENT_TOOLSDIRECTORY: /opt/hostedtoolcache
      TESTCONTAINERS_RYUK_DISABLED: "true"
    network_mode: host
    volumes:
      - /tmp/gh-runner-work-1:/tmp/gh-runner-work-1
      - /var/run/docker.sock:/var/run/docker.sock

  gh-runner-alfabra-2:
    <<: *runner-common
    container_name: gh-runner-alfabra-2
    environment:
      REPO_URL: https://github.com/Tavaressan/Alfabra-Vector
      RUNNER_SCOPE: repo
      APP_ID: "4358824"
      APP_LOGIN: Tavaressan
      APP_PRIVATE_KEY: ${GH_RUNNER_APP_PRIVATE_KEY}
      RUNNER_NAME: alfabra-local-mac-2
      RUNNER_WORKDIR: /tmp/gh-runner-work-2
      LABELS: alfabra-local
      AGENT_TOOLSDIRECTORY: /opt/hostedtoolcache
      TESTCONTAINERS_RYUK_DISABLED: "true"
    network_mode: host
    volumes:
      - /tmp/gh-runner-work-2:/tmp/gh-runner-work-2
      - /var/run/docker.sock:/var/run/docker.sock
