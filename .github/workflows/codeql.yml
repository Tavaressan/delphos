name: CodeQL

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop
  schedule:
    # Segunda-feira 06:00 UTC — cobre vulnerabilidades novas em código que
    # não mudou (CVEs publicadas depois do último scan), não só PRs novas.
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # java-kotlin cobre java-core (Java 17/Spring Boot); javascript-typescript
        # cobre frontend (Next.js/TS); python cobre python-services/crew-worker.
        # Sem entrada para Rust — CodeQL não suporta a linguagem (issue #176
        # cobre o gap Rust via cargo audit/cargo deny, não CodeQL).
        include:
          - language: java-kotlin
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
