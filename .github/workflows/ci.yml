name: CI Pipeline

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      java: ${{ steps.filter.outputs.java }}
      frontend: ${{ steps.filter.outputs.frontend }}
      python: ${{ steps.filter.outputs.python }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'rust-services/**'
              - '.github/workflows/ci.yml'
            java:
              - 'java-core/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            python:
              - 'python-services/**'
              - '.github/workflows/ci.yml'

  rust-check:
    name: Rust Check, Lint, Format & Test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust-services -> rust-services/target"
          cache-all-crates: "true"
          shared-key: "stable"

      - name: Check Formatting (cargo fmt)
        run: |
          cd rust-services
          cargo fmt --all -- --check

      - name: Check Code (cargo check)
        run: |
          cd rust-services
          cargo check --workspace

      - name: Run Linter (cargo clippy)
        run: |
          cd rust-services
          cargo clippy --workspace -- -D warnings

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Run Tests (cargo nextest)
        run: |
          cd rust-services
          cargo nextest run --workspace

  java-check:
    name: Java Core Build & Test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.java == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Compile with Gradle
        run: |
          cd java-core
          chmod +x gradlew
          ./gradlew compileJava compileTestJava

      - name: Test with Gradle
        run: |
          cd java-core
          ./gradlew test

  java-integration:
    name: Java Core Integration Tests (BDD)
    runs-on: ubuntu-latest
    needs: [changes, java-check]
    if: needs.changes.outputs.java == 'true'
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Run Integration Tests
        run: |
          cd java-core
          chmod +x gradlew
          ./gradlew integrationTest

  frontend-check:
    name: Frontend Lint, Test & Build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Next.js Cache
        uses: actions/cache@v4
        with:
          path: |
            frontend/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('frontend/package-lock.json') }}-${{ hashFiles('frontend/src/**/*.[jt]s', 'frontend/src/**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('frontend/package-lock.json') }}-

      - name: Run Lint
        run: |
          cd frontend
          npm run lint

      - name: Run Tests
        run: |
          cd frontend
          npm test

      - name: Build next
        run: |
          cd frontend
          npm run build

  python-ci:
    name: Python Lint & Test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.python == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'python-services/crew-worker/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f python-services/crew-worker/requirements.txt ]; then
            pip install -r python-services/crew-worker/requirements.txt
          fi
          pip install black flake8 pytest

      - name: Run Linter (Flake8)
        run: |
          flake8 python-services --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 python-services --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Check Code Formatting (Black)
        run: |
          black --check python-services

      - name: Run Tests (PyTest)
        run: |
          pytest python-services --ignore=python-services/crew-worker/.venv || [ $? -eq 5 ]
