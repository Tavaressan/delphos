name: CI Pipeline

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    # Default implícito (opened, synchronize, reopened) não inclui
    # ready_for_review — sem isso, marcar um PR draft como "Ready for
    # review" não dispara um novo run e os jobs pulados em draft (ver
    # draft-skip abaixo) nunca rodam antes do merge (issue #250).
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
      - master
      - develop
  # Sem isto não há como re-disparar o pipeline sobre um SHA já mergeado. Foi
  # exatamente o que faltou quando o run de `cfd7bf5` (#265) morreu cancelado
  # pelo merge seguinte e os jobs pendentes ficaram sem cobertura alguma.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Em PR, cancelar o run anterior a cada push é economia pura. Em `master`
  # (e nas demais branches de push) é perda de cobertura: dois merges em
  # sequência caem no mesmo grupo `refs/heads/master` e o segundo cancela a
  # validação do primeiro — que, sendo um commit já mergeado, nunca mais será
  # revalidado. Aconteceu com `cfd7bf5`: 5 jobs (Rust Check, Docker Java,
  # Crew worker, BDD, E2E) cancelados pelo merge de `4ddae3e`, e o run de
  # `4ddae3e` os pulou por path-filter. Mesma classe de furo da issue #87.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

env:
  # Base do registro de imagens publicadas pelos jobs docker-build-* (issue
  # #203). Minúsculo fixo (não deriva de github.repository): o GHCR exige
  # nomes de imagem em lowercase, e o nome do repo no GitHub é
  # "Tavaressan/Alfabra-Vector" (mixed case).
  REGISTRY: ghcr.io
  IMAGE_BASE: tavaressan/alfabra-vector

jobs:
  # Fallback automático entre self-hosted (local + EC2, label alfabra-local)
  # e GitHub-hosted: GitHub Actions não faz balanceamento entre pools por si
  # só (runs-on é match estático de label), então este job checa em tempo
  # real se há ao menos um runner self-hosted online e decide o pool para
  # todos os demais jobs. `|| echo 0` garante fail-safe (mesma filosofia do
  # job `changes` ver #87): qualquer erro na checagem (rate limit, API fora)
  # cai para ubuntu-latest em vez de travar o pipeline inteiro.
  select-runner:
    name: Select CI runner pool
    runs-on: ubuntu-latest
    # Depende de `changes` para saber se algum job que de fato roda no EC2
    # (rust/java/python/e2e — ver a tabela de pools abaixo) foi disparado.
    # Sem isso, toda PR — inclusive as que só tocam docs ou frontend —
    # acordava a instância e a mantinha ligada até o auto-stop por
    # ociosidade. Custo: `changes` (~10s) entra no caminho crítico antes do
    # start-instances; irrelevante com a instância quente e ~10s a mais
    # sobre os ~200s de um cold-boot genuíno.
    needs: changes
    permissions:
      actions: read
      id-token: write
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
    env:
      # Só estes 4 filtros disparam jobs que permanecem no pool self-hosted
      # (mesma condição do `if` de e2e-integration). `frontend` fica de fora
      # de propósito: frontend-check e docker-build-frontend migraram para o
      # pool GitHub-hosted, então uma PR que só toca frontend/ não precisa da
      # EC2. O contexto `env` é legível em `if` de step (não em `if` de job),
      # que é exatamente como esta condição é consumida abaixo.
      NEEDS_EC2: ${{ needs.changes.outputs.rust == 'true' || needs.changes.outputs.java == 'true' || needs.changes.outputs.python == 'true' || needs.changes.outputs.e2e == 'true' }}
    steps:
      # Sem isso, o runner EC2 só entra no ar se alguém der `aws ec2
      # start-instances` manualmente (ver #345) — o que faz quase todo push
      # cair no fallback hosted. A role é assumida via OIDC (sem access key
      # fixa em secret) e só permite start-instances nesta instância
      # específica + describe-instances read-only.
      # PRs abertas pelo Dependabot rodam em contexto restrito sem acesso aos
      # secrets de Actions do repositório (só ao GITHUB_TOKEN automático e a
      # "Dependabot secrets", não cadastrados aqui — ver #350). O step
      # seguinte de app-token sempre falhava com "private-key" vazio nesse
      # caso, derrubando o job inteiro antes de chegar no fallback hosted.
      # Pula toda a tentativa de self-hosted/EC2 para esse actor.
      - name: Configure AWS credentials (OIDC)
        if: github.actor != 'dependabot[bot]' && env.NEEDS_EC2 == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::076248672901:role/alfabra-ci-github-actions-start
          aws-region: us-east-1

      - name: Start EC2 CI runner instance (idempotente)
        if: github.actor != 'dependabot[bot]' && env.NEEDS_EC2 == 'true'
        env:
          INSTANCE_ID: i-060c83aa05d25e679
        run: |
          set -euo pipefail
          STATE=$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].State.Name' --output text)
          echo "Estado atual da instância: $STATE"
          if [ "$STATE" = "stopped" ]; then
            aws ec2 start-instances --instance-ids "$INSTANCE_ID" >/dev/null
            echo "::notice::Instância EC2 estava parada, start-instances disparado"
          fi

      # secrets.GITHUB_TOKEN nunca consegue chamar "List self-hosted runners
      # for a repository" (retorna 403 "Resource not accessible by
      # integration" sempre, independente do bloco `permissions:` do job —
      # não existe chave de permissão para isso no GITHUB_TOKEN automático).
      # Confirmado no run 30823634398: as 24 tentativas do poll abaixo
      # falharam com 403, mascaradas por `|| echo 0` como "nenhum runner
      # online", mesmo com os runners de fato online. A mesma GitHub App
      # (app-id 4358824) já usada para registrar os runners na EC2 (ver
      # scripts/ci-runner-ec2-bootstrap.sh) tem permissão de administração
      # do repositório — gera um token de instalação dela aqui só para essa
      # checagem.
      - name: Gera token da GitHub App (permissão de administração)
        id: app-token
        if: github.actor != 'dependabot[bot]' && env.NEEDS_EC2 == 'true'
        uses: actions/create-github-app-token@v1
        with:
          app-id: 4358824
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Check self-hosted runner availability
        id: pick
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          # Ver #350: sem os steps acima (pulados para este actor), não há
          # instância EC2 disparada nem GH_TOKEN válido para consultar
          # runners self-hosted — cai direto para GitHub-hosted.
          if [ "${{ github.actor }}" = "dependabot[bot]" ]; then
            echo "::notice::Actor é dependabot[bot] (sem acesso a secrets de Actions, ver #350) - fallback direto para GitHub-hosted"
            echo 'runner=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Nenhum job do pool self-hosted foi disparado por esta mudança: os
          # steps de start-instances/app-token acima foram pulados, então não
          # há instância subindo nem GH_TOKEN para consultar runners. Emite o
          # mesmo formato de output esperado pelo fromJSON dos dependentes —
          # este job nunca pode ser pulado no nível de job, senão os outputs
          # somem e todo `runs-on` derivado quebra (mesma armadilha da matrix
          # documentada em docker-build-rust).
          if [ "$NEEDS_EC2" != "true" ]; then
            echo "::notice::Nenhum job self-hosted disparado (rust/java/python/e2e inalterados) - EC2 não foi acordada, usando GitHub-hosted"
            echo 'runner=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A instância pode levar ~30-60s pra bootar e o runner registrar
          # no GitHub após o start-instances acima — poll com timeout em vez
          # de checar uma única vez, senão todo cold-start cairia no
          # fallback hosted mesmo com a EC2 subindo com sucesso. Janela
          # ampliada de 180s para 240s (24x10s): no run 30823116364, com a
          # instância genuinamente "stopped" (cold boot completo), o
          # start-instances disparou às 14:31:56 e os runners
          # (alfabra-ec2-1/2) só apareceram "online" por volta de
          # 14:35:04-14:35:15 (~188-199s depois) — o poll de 180s esgotou
          # a poucos segundos do runner ficar pronto. 240s dá ~50s de
          # margem sobre o cold-boot medido.
          #
          # issue #349: esse cold-boot de ~200s só acontece quando a
          # instância EC2 está genuinamente "stopped" (não quando os
          # containers do runner apenas reiniciam — systemd
          # Restart=always já cobre isso sem reboot). A causa raiz de o
          # cold-boot se repetir a cada PR da fila serializada era o
          # auto-stop por ociosidade (scripts/ec2-idle-stop.sh) desligando
          # a instância cedo demais — corrigido usando a média de carga de
          # 15min em vez de 1min, exigindo ociosidade sustentada antes de
          # parar. O poll de 240s aqui continua necessário como
          # salvaguarda para o caso (mais raro após o fix) de cold-boot
          # genuíno.
          ONLINE=0
          for _ in $(seq 1 24); do
            ONLINE=$(gh api "repos/${{ github.repository }}/actions/runners" --paginate \
              --jq '[.runners[] | select(.status == "online" and (.labels[].name == "alfabra-local"))] | length' \
              2>/dev/null || echo 0)
            if [ "$ONLINE" -gt 0 ]; then
              break
            fi
            sleep 10
          done
          if [ "$ONLINE" -gt 0 ]; then
            echo "::notice::$ONLINE runner(s) self-hosted online (label alfabra-local) - usando self-hosted"
            echo 'runner=["self-hosted","alfabra-local"]' >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Nenhum runner self-hosted online após poll - fallback para GitHub-hosted (ubuntu-latest)"
            echo 'runner=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
          fi

  changes:
    name: Detect changed paths
    # Sempre GitHub-hosted: precede select-runner (que agora depende deste job
    # para decidir se acorda a EC2) e é trabalho trivial de ~10s, sem nenhum
    # cache local no host self-hosted que justificasse rodar lá.
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.normalize.outputs.rust }}
      java: ${{ steps.normalize.outputs.java }}
      frontend: ${{ steps.normalize.outputs.frontend }}
      python: ${{ steps.normalize.outputs.python }}
      e2e: ${{ steps.normalize.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Necessário para o turbo `--affected` conseguir calcular o
          # merge-base contra a branch base sem marcar tudo como afetado
          # por engano (clone raso = "sufficient history" ausente, ver docs
          # oficiais do Turborepo).
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Detecção via `turbo ls --affected`, que só exige um `package.json`
      # fino em cada módulo como marcador de fronteira de pacote (sem
      # turbo.json com tasks, sem duplicar comandos que já existem abaixo
      # neste workflow). Substitui o dorny/paths-filter para os 4 módulos
      # do workspace (rust/java/frontend/python) — ver estudo de
      # Turborepo x Deno Workspaces. `.github/workflows/ci.yml` e a suíte
      # `tests/e2e/**` não pertencem a nenhum pacote do workspace, então
      # continuam cobertos por diff manual no step de normalização abaixo.
      - name: Detect affected packages (Turborepo)
        id: filter
        # Nunca deixe uma falha de cálculo de affected derrubar o job
        # silenciosamente (issue #87) — o step de normalização abaixo trata
        # esse caso como fail-safe (roda tudo).
        continue-on-error: true
        env:
          GH_EVENT: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # Base explícita por tipo de evento, no mesmo espírito do que o
          # dorny/paths-filter fazia: PR compara contra o SHA base do PR;
          # push (long-lived branch) compara contra o commit anterior no
          # mesmo branch. Fallback para HEAD~1 só no caso extremo de
          # `before` vir zerado (primeiro push histórico do branch).
          if [ "$GH_EVENT" = "pull_request" ]; then
            BASE="$PR_BASE_SHA"
          elif [ -n "$PUSH_BEFORE_SHA" ] && [ "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            BASE="$PUSH_BEFORE_SHA"
          else
            BASE="HEAD~1"
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "::notice::turbo ls --affected comparado contra $BASE (evento: $GH_EVENT)"

          RAW=$(TURBO_SCM_BASE="$BASE" npx --yes turbo@2.10.8 ls --affected --output=json)
          # Descarta a linha de banner ("• turbo x.y.z") impressa antes do JSON.
          JSON=$(echo "$RAW" | sed -n '/^{/,$p')
          echo "affected_json<<AFFECTED_EOF" >> "$GITHUB_OUTPUT"
          echo "$JSON" >> "$GITHUB_OUTPUT"
          echo "AFFECTED_EOF" >> "$GITHUB_OUTPUT"

      - name: Normalize filter outputs (fail-safe)
        id: normalize
        if: always()
        env:
          OUTCOME: ${{ steps.filter.outcome }}
          BASE: ${{ steps.filter.outputs.base }}
          AFFECTED_JSON: ${{ steps.filter.outputs.affected_json }}
        run: |
          set -euo pipefail

          run_all() {
            echo "rust=true" >> "$GITHUB_OUTPUT"
            echo "java=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "python=true" >> "$GITHUB_OUTPUT"
            echo "e2e=true" >> "$GITHUB_OUTPUT"
          }

          # Fail-safe: se o turbo ls --affected falhou ou não conseguiu
          # calcular o diff, NUNCA pule checks silenciosamente — rode todos
          # os módulos por padrão (issue #87).
          if [ "$OUTCOME" != "success" ]; then
            echo "::warning::turbo ls --affected falhou (outcome=$OUTCOME) - failing safe: rodando TODOS os módulos"
            run_all
            exit 0
          fi

          CHANGED=$(git diff --name-only "$BASE"...HEAD)

          # Mudança no próprio workflow: roda todos os módulos para
          # validar o novo pipeline de ponta a ponta. ci.yml não é um
          # pacote do workspace, então o turbo nunca o marcaria como
          # afetado por conta própria (issue #77).
          if echo "$CHANGED" | grep -q '^\.github/workflows/ci\.yml$'; then
            echo "::notice::ci.yml alterado - rodando todos os módulos"
            run_all
            exit 0
          fi

          RUST=$(echo "$AFFECTED_JSON" | python3 -c "import json,sys; d=json.load(sys.stdin); print('true' if any(p['path']=='rust-services' for p in d['packages']['items']) else 'false')")
          JAVA=$(echo "$AFFECTED_JSON" | python3 -c "import json,sys; d=json.load(sys.stdin); print('true' if any(p['path']=='java-core' for p in d['packages']['items']) else 'false')")
          FRONTEND=$(echo "$AFFECTED_JSON" | python3 -c "import json,sys; d=json.load(sys.stdin); print('true' if any(p['path']=='frontend' for p in d['packages']['items']) else 'false')")
          PYTHON=$(echo "$AFFECTED_JSON" | python3 -c "import json,sys; d=json.load(sys.stdin); print('true' if any(p['path']=='python-services/crew-worker' for p in d['packages']['items']) else 'false')")

          # tests/e2e/** e os arquivos de infra que e2e-integration usa
          # diretamente não pertencem a nenhum pacote do workspace turbo —
          # continuam cobertos por diff manual (mesmo motivo da PR #122:
          # sem isso, uma mudança só em tests/e2e/** faz todos os módulos
          # ficarem 'false' e o job que deveria validar essa mudança é
          # pulado).
          E2E=false
          if echo "$CHANGED" | grep -qE '^(tests/e2e/|docker-compose\.yml$|docker-compose\.ci-ports\.yml$|scripts/reset\.sh$|scripts/setup\.sh$)'; then
            E2E=true
          fi

          echo "rust=$RUST" >> "$GITHUB_OUTPUT"
          echo "java=$JAVA" >> "$GITHUB_OUTPUT"
          echo "frontend=$FRONTEND" >> "$GITHUB_OUTPUT"
          echo "python=$PYTHON" >> "$GITHUB_OUTPUT"
          echo "e2e=$E2E" >> "$GITHUB_OUTPUT"

      - name: Sanity check filter outputs
        if: always()
        run: |
          set -euo pipefail
          echo "Outcome do turbo ls --affected: ${{ steps.filter.outcome }}"
          echo "rust=${{ steps.normalize.outputs.rust }}"
          echo "java=${{ steps.normalize.outputs.java }}"
          echo "frontend=${{ steps.normalize.outputs.frontend }}"
          echo "python=${{ steps.normalize.outputs.python }}"
          echo "e2e=${{ steps.normalize.outputs.e2e }}"
          if [ -z "${{ steps.normalize.outputs.rust }}" ] || \
             [ -z "${{ steps.normalize.outputs.java }}" ] || \
             [ -z "${{ steps.normalize.outputs.frontend }}" ] || \
             [ -z "${{ steps.normalize.outputs.python }}" ] || \
             [ -z "${{ steps.normalize.outputs.e2e }}" ]; then
            echo "::error::Um ou mais outputs do filtro de paths estão vazios - normalize step com bug"
            exit 1
          fi

  rust-check:
    name: Rust Check, Lint, Format & Test
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runner) }}
    needs: [select-runner, changes]
    if: needs.changes.outputs.rust == 'true'
    # Postgres efêmero para os testes marcados com #[sqlx::test] (issue #266): o
    # sqlx cria um banco por teste a partir de DATABASE_URL e aplica as migrações
    # do próprio crate.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          # Banco efêmero de CI, acessível apenas de dentro do job: trust evita
          # carregar uma credencial no workflow só para os testes.
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        # Porta efêmera, não 5432 fixa: no runner self-hosted a 5432 do host já
        # está ocupada (stack local / job paralelo) e o container falhava com
        # "Bind for 0.0.0.0:5432 failed: port is already allocated", derrubando
        # todo job que toca Rust. A porta sorteada é lida via job.services.
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust-services -> rust-services/target"
          cache-all-crates: "true"
          shared-key: "stable"

      - name: Check Formatting (cargo fmt)
        run: |
          cd rust-services
          cargo fmt --all -- --check

      - name: Check Code (cargo check)
        run: |
          cd rust-services
          cargo check --workspace

      - name: Run Linter (cargo clippy)
        run: |
          cd rust-services
          cargo clippy --workspace -- -D warnings

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Run Tests (cargo nextest)
        # O contexto `job` não existe em env de nível de job — só dentro de
        # steps —, e usá-lo lá invalida o workflow inteiro (o CI Pipeline deixa
        # de disparar). A porta sorteada para o Postgres é lida aqui.
        env:
          DATABASE_URL: postgres://postgres@localhost:${{ job.services.postgres.ports['5432'] }}/postgres
        run: |
          cd rust-services
          cargo nextest run --workspace

      # Issue #176: vulnerabilidades conhecidas (RUSTSEC) nas dependências.
      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Audit dependencies (cargo audit)
        run: |
          cd rust-services
          cargo audit

      # Issue #176: licenças incompatíveis, crates banidas/duplicadas e
      # fontes não confiáveis (config em rust-services/deny.toml).
      - name: Audit licenses/bans/sources (cargo deny)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: rust-services/Cargo.toml

  java-check:
    name: Java Core Build & Test
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runner) }}
    needs: [select-runner, changes]
    if: needs.changes.outputs.java == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Compile with Gradle
        run: |
          cd java-core
          chmod +x gradlew
          ./gradlew compileJava compileTestJava bootJar

      - name: Test with Gradle
        run: |
          cd java-core
          ./gradlew test

      - name: Verify migrations in JAR
        run: |
          cd java-core
          jar tf build/libs/*.jar | grep "db/migration/V" || (echo "❌ Flyway migrations not found in JAR" && exit 1)

  java-integration:
    name: Java Core Integration Tests (BDD)
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runner) }}
    needs: [select-runner, changes, java-check]
    if: needs.changes.outputs.java == 'true'
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Run Integration Tests
        run: |
          cd java-core
          chmod +x gradlew
          ./gradlew integrationTest

      # Convenção padrão do Gradle para a task `integrationTest` (Test task
      # nomeada, sem override de `reporting`/`reports.html.outputLocation`
      # em build.gradle.kts): build/reports/tests/integrationTest/ (HTML) e
      # build/test-results/integrationTest/ (XML). Sobe as duas árvores de
      # relatório (não só o HTML) para cobrir o formato mais fácil de
      # inspecionar depois que o job expira (issue #200).
      - name: Upload integration test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: java-integration-test-report
          path: |
            java-core/build/reports/tests/
            java-core/build/test-results/
          if-no-files-found: warn
          retention-days: 7

  frontend-check:
    name: Frontend Lint, Test & Build
    # Pool GitHub-hosted: o setup-deno roda com cache: false (issue #227) e o
    # cache do Next.js vem do actions/cache pela rede — nada aqui aproveita o
    # disco local do runner EC2, e liberar o slot lá reduz a fila dos jobs que
    # de fato dependem de cache quente (rust-check, java-*).
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Runtime do frontend (issue #187, Fase 2). O Deno substitui o Node em
      # todo o ciclo: install, lint, test e build.
      #
      # Issue #227: cache: true (actions/cache via setup-deno) entra num
      # ciclo de auto-corrupção — quando `deno install` falha com "failed to
      # create directory node_modules/.deno/node_modules: File exists", o
      # post-step do actions/cache salva o cache mesmo assim (ação não expõe
      # `if: success()`), perpetuando o mesmo estado quebrado sob a mesma
      # chave (hash de deno.lock) em toda run seguinte. Confirmado: purgar a
      # entrada manualmente e até remover o diretório segundos antes do
      # install não resolve, porque a run que falha recria o cache quebrado
      # de novo no final. O job `docker-build-frontend` roda o mesmo
      # `deno install`, sempre sem esse cache (dentro do container, do zero),
      # e nunca falha — confirma que a causa é o cache, não o `deno install`
      # em si. cache: false quebra o ciclo definitivamente, ao custo de um
      # `deno install` mais lento (download completo a cada run).
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: false

      - name: Install dependencies
        run: |
          cd frontend
          deno install

      - name: Next.js Cache
        uses: actions/cache@v4
        with:
          path: |
            frontend/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('deno.lock') }}-${{ hashFiles('frontend/src/**/*.[jt]s', 'frontend/src/**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('deno.lock') }}-

      - name: Run Lint
        run: |
          cd frontend
          deno task lint

      - name: Run Tests
        run: |
          cd frontend
          deno task test

      - name: Build next
        run: |
          cd frontend
          deno task build

      # Suíte de responsividade Playwright (issue #232, depende de #231).
      # Gate obrigatório separado dos testes unitários acima: sobe o build
      # de produção real (via playwright.config.ts) e valida sidebar,
      # header e PanelDock nos viewports mobile/tablet/desktop. Escopada
      # pelo mesmo path-filter do job (needs.changes.outputs.frontend).
      - name: Install Playwright Browsers
        run: |
          cd frontend
          npx playwright install --with-deps chromium

      - name: Run Playwright viewport suite
        run: |
          cd frontend
          deno task test:viewport

  python-ci:
    name: Python Lint & Test
    # Pool GitHub-hosted: cache de pip via actions/setup-python (rede), sem
    # dependência do disco local do EC2.
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.python == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'python-services/crew-worker/requirements.lock.txt'

      # Instala o mesmo conjunto pinado que a imagem do crew-worker (ver
      # python-services/crew-worker/Dockerfile): mantém teste e imagem no mesmo
      # conjunto de versões e evita o backtracking do resolver sobre as faixas
      # abertas de requirements.txt.
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f python-services/crew-worker/requirements.lock.txt ]; then
            pip install -r python-services/crew-worker/requirements.lock.txt
          fi
          pip install black flake8 pytest pip-audit

      # Issue #176: vulnerabilidades conhecidas (PyPA Advisory DB) nas
      # dependências pinadas em requirements.txt.
      - name: Audit dependencies (pip-audit)
        run: |
          if [ -f python-services/crew-worker/requirements.txt ]; then
            pip-audit -r python-services/crew-worker/requirements.txt
          fi

      - name: Run Linter (Flake8)
        run: |
          flake8 python-services --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 python-services --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Check Code Formatting (Black)
        run: |
          black --check --diff python-services || echo "::warning::Formatação Black divergente — rode 'black python-services' localmente antes do próximo PR."

      - name: Run Tests (PyTest)
        run: |
          pytest python-services --ignore=python-services/crew-worker/.venv || [ $? -eq 5 ]

  # Jobs de build de imagem Docker (issue #86). Rodam em paralelo aos
  # builds/testes nativos acima (needs: changes, nunca needs: <job nativo>)
  # e são escopados pelo mesmo path-filter corrigido em #77/#87 — não
  # substituem os builds nativos, apenas validam que a imagem também builda.
  docker-build-rust:
    name: Docker Build (Rust services)
    # Pool GitHub-hosted: o cache do buildx aqui é type=gha (ver cache-from/to
    # abaixo), ou seja, trafega pela rede e não ganha nada com o disco local do
    # EC2. São 4 jobs de matrix — a maior fatia de compute do pipeline — que no
    # self-hosted disputavam 2 slots e aqui expandem em paralelo. As imagens vão
    # para o GHCR e o e2e-integration as consome via `docker compose pull`, não
    # pelo daemon que as construiu, então o split não quebra a cadeia.
    runs-on: ubuntu-latest
    needs: changes
    permissions:
      contents: read
      packages: write
    # Sem `if` no nível do job: um job com `strategy.matrix` que é pulado
    # via `if` de job não expande a matrix e não posta check-run algum
    # para as combinações nomeadas (ex.: "... (embedding-service)"), que
    # são justamente os contexts exigidos pelo branch protection. Isso
    # deixa esses 4 required checks presos para sempre em "Expected —
    # Waiting for status to be reported", bloqueando o merge de qualquer
    # PR que não toque rust-services/** (achado ao investigar softlock no
    # PR #224). Por isso o gate fica no step de build, não no job — mesmo
    # padrão usado abaixo para pular em PRs draft (issue #250).
    strategy:
      matrix:
        service:
          - embedding-service
          - ingestion-worker
          - rag-worker
          - workflow-worker
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        if: needs.changes.outputs.rust == 'true' && github.event.pull_request.draft != true
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: needs.changes.outputs.rust == 'true' && github.event.pull_request.draft != true
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag do SHA sempre publicada (necessária para o pull de e2e-integration
      # mesmo em PRs). Tag :latest só é atualizada em push nas branches
      # long-lived (main/master/develop, únicas cobertas por `on.push` neste
      # workflow) — nunca a partir de uma PR, para não sobrescrever o
      # fallback ":latest" usado pelo e2e-integration de outras PRs
      # concorrentes que não tocaram este módulo (issue #203).
      - name: Compute image tags
        id: meta
        if: needs.changes.outputs.rust == 'true' && github.event.pull_request.draft != true
        run: |
          set -euo pipefail
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}/${{ matrix.service }}"
          if [ "${{ github.event_name }}" = "push" ]; then
            TAGS=$(printf '%s:%s\n%s:latest' "$IMAGE" "${{ github.sha }}" "$IMAGE")
          else
            TAGS="$IMAGE:${{ github.sha }}"
          fi
          {
            echo "tags<<TAGS_EOF"
            echo "$TAGS"
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.service }} image
        if: needs.changes.outputs.rust == 'true' && github.event.pull_request.draft != true
        uses: docker/build-push-action@v6
        with:
          context: ./rust-services
          file: ./rust-services/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.service }}
          # Export só em push para a default branch. Cache gravado por run de
          # PR é escopado ao merge ref (refs/pull/N/merge) e, por regra do
          # GitHub, não pode ser restaurado nem por `master` nem por outro PR
          # — só infla a cota de 10 GB do repo até evictar por LRU o cache de
          # `master`, que é o único de leitura universal. Medição de 14/08:
          # 5,22 GB dos 9,44 GB em uso eram exatamente esse lixo, contra
          # 4,51 GB de `master`. O PR continua com hit porque pode ler o
          # cache da base branch.
          cache-to: ${{ github.event_name == 'push' && format('type=gha,mode=max,scope={0}', matrix.service) || '' }}

      # Issue #176: CVEs conhecidas na imagem publicada (SO + deps do binário).
      - name: Scan ${{ matrix.service }} image (Trivy)
        if: needs.changes.outputs.rust == 'true'
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}/${{ matrix.service }}:${{ github.sha }}
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

  docker-build-java:
    name: Docker Build (Java core)
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runner) }}
    needs: [select-runner, changes]
    # PRs draft não expandem matrix (ver docker-build-rust acima), então
    # aqui o gate de draft-skip pode ficar no nível do job com segurança
    # (issue #250): job único, um só check-run "skipped" é postado.
    if: needs.changes.outputs.java == 'true' && github.event.pull_request.draft != true
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        run: |
          set -euo pipefail
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}/java-core"
          if [ "${{ github.event_name }}" = "push" ]; then
            TAGS=$(printf '%s:%s\n%s:latest' "$IMAGE" "${{ github.sha }}" "$IMAGE")
          else
            TAGS="$IMAGE:${{ github.sha }}"
          fi
          {
            echo "tags<<TAGS_EOF"
            echo "$TAGS"
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push java-core image
        uses: docker/build-push-action@v6
        with:
          context: ./java-core
          file: ./java-core/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=java-core
          # Export só em push (ver docker-build-rust): cache de PR é
          # escopado ao merge ref e inutilizável fora dele.
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=java-core' || '' }}

      # Issue #176: CVEs conhecidas na imagem publicada (SO + deps do binário).
      - name: Scan java-core image (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}/java-core:${{ github.sha }}
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

  docker-build-frontend:
    name: Docker Build (Frontend)
    # Pool GitHub-hosted (mesma razão de cache type=gha dos demais). Com este
    # job e o frontend-check fora do EC2, o filtro `frontend` deixa de exigir a
    # instância — por isso ele não aparece na condição NEEDS_EC2 do
    # select-runner.
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true' && github.event.pull_request.draft != true
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        run: |
          set -euo pipefail
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}/frontend"
          if [ "${{ github.event_name }}" = "push" ]; then
            TAGS=$(printf '%s:%s\n%s:latest' "$IMAGE" "${{ github.sha }}" "$IMAGE")
          else
            TAGS="$IMAGE:${{ github.sha }}"
          fi
          {
            echo "tags<<TAGS_EOF"
            echo "$TAGS"
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=frontend
          # Export só em push (ver docker-build-rust): cache de PR é
          # escopado ao merge ref e inutilizável fora dele.
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=frontend' || '' }}

      # Issue #176: CVEs conhecidas na imagem publicada (SO + deps do binário).
      - name: Scan frontend image (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}/frontend:${{ github.sha }}
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

  docker-build-python:
    name: Docker Build (Crew worker)
    # Pool GitHub-hosted, mesma razão do docker-build-rust/frontend: o cache é
    # type=gha (trafega pela rede, não ganha com o disco do EC2) e a imagem vai
    # para o GHCR, de onde o e2e a consome via pull. Além disso este era o job
    # mais lento do pool self-hosted — 31 min sem terminar em `cfd7bf5` e
    # 14 min em #367, monopolizando um dos 2 slots enquanto Rust/Java/BDD
    # esperavam na fila.
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.python == 'true' && github.event.pull_request.draft != true
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        run: |
          set -euo pipefail
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}/crew-worker"
          if [ "${{ github.event_name }}" = "push" ]; then
            TAGS=$(printf '%s:%s\n%s:latest' "$IMAGE" "${{ github.sha }}" "$IMAGE")
          else
            TAGS="$IMAGE:${{ github.sha }}"
          fi
          {
            echo "tags<<TAGS_EOF"
            echo "$TAGS"
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push crew-worker image
        uses: docker/build-push-action@v6
        with:
          context: ./python-services/crew-worker
          file: ./python-services/crew-worker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=crew-worker
          # Export só em push (ver docker-build-rust): cache de PR é
          # escopado ao merge ref e inutilizável fora dele.
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=crew-worker' || '' }}

      # Issue #176: CVEs conhecidas na imagem publicada (SO + deps do binário).
      - name: Scan crew-worker image (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}/crew-worker:${{ github.sha }}
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

  # Imagem do sidecar de execução isolada de scripts (issue #148). Mesmo path-filter
  # `python` do job `changes` e mesma política de gate dos demais docker-build-*.
  docker-build-python-executor:
    name: Docker Build (Script executor sidecar)
    # Hosted pela mesma razão do docker-build-python acima. O cache
    # scope=script-executor que este job aquece é consumido depois pelo
    # e2e-integration; sendo type=gha (remoto), o reaproveitamento independe
    # de os dois jobs estarem no mesmo pool.
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.python == 'true' && github.event.pull_request.draft != true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # `load: true` + tag local (sem push) para o Trivy conseguir escanear
      # a imagem abaixo — esta imagem nunca é publicada no GHCR (só validação
      # de build), então não usa o padrão de tags SHA/latest dos demais jobs.
      - name: Build script-executor image
        uses: docker/build-push-action@v6
        with:
          context: ./python-services/crew-worker
          file: ./python-services/crew-worker/Dockerfile.executor
          push: false
          load: true
          tags: script-executor:${{ github.sha }}
          cache-from: type=gha,scope=script-executor
          # Export só em push (ver docker-build-rust): cache de PR é
          # escopado ao merge ref e inutilizável fora dele.
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=script-executor' || '' }}

      # Issue #176: CVEs conhecidas na imagem (SO + deps do binário).
      - name: Scan script-executor image (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: script-executor:${{ github.sha }}
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

  # Job de integração cross-container (issue interna: gate de mock LLM no CI).
  # Diferente dos jobs docker-build-*, que só validam que cada imagem builda
  # isoladamente, este job sobe a stack inteira via docker-compose (usando
  # `-f docker-compose.yml` explícito para NÃO mesclar o
  # docker-compose.override.yml, que força EMBEDDING_PROVIDER=real para dev
  # local) e roda a suíte E2E (tests/e2e/runner.test.js) contra os containers
  # reais se comunicando entre si. LLM_PROVIDER=mock e EMBEDDING_PROVIDER=mock
  # evitam qualquer chamada de rede à Vertex AI — só a orquestração via
  # RabbitMQ, a busca vetorial no pgvector e o HTTP entre serviços são reais.
  # Roda sempre que qualquer módulo mudar (mesmo path-filter do job `changes`)
  # porque uma regressão de integração pode vir de qualquer serviço, e também
  # quando a própria suíte E2E (ou os arquivos docker-compose/scripts que ela
  # usa) mudar — sem o filtro `e2e`, uma PR que só adiciona/ajusta cenários em
  # tests/e2e/** nunca disparava este job (achado ao mesclar a PR #122).
  e2e-integration:
    name: Integration E2E (Docker Compose + Mock LLM)
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runner) }}
    needs: [select-runner, changes, docker-build-rust, docker-build-java, docker-build-frontend, docker-build-python]
    # issue #359: os runners da EC2 são containers em DooD (Docker-outside-of-
    # Docker) sobre o daemon do host, e dois jobs E2E concorrentes derivam o
    # mesmo COMPOSE_PROJECT_NAME do diretório — o segundo recria os containers
    # do primeiro, que morre com "No such container". Com o split de pool
    # liberando slots no EC2, a chance de dois E2E coincidirem aumenta, então a
    # serialização deixa de ser opcional. cancel-in-progress: false porque o run
    # que já está de pé precisa terminar seu teardown (`down -v`); o
    # concurrency de workflow (topo do arquivo, por ref) já impede acúmulo de
    # runs obsoletos na fila. O grupo é global ao repositório porque
    # `runner.name` não existe no contexto concurrency (avaliado antes da
    # atribuição do runner) — aceitável com o E2E médio em ~2 min.
    concurrency:
      group: e2e-integration
      cancel-in-progress: false
    # Explícito e não ambíguo de propósito (em vez de depender do
    # comportamento implícito de success() com deps "skipped"): roda quando
    # `changes` teve sucesso, o PR não está em draft (issue #250 — este job
    # é caro e o issue-coordinator/worktree-ship passam a maior parte do
    # tempo em draft, em loop de fix-and-retry), cada docker-build-* OU
    # teve sucesso OU foi pulado (módulo não mudou — não é falha), e ao
    # menos um módulo
    # relevante mudou. Se qualquer docker-build-* FALHOU, este job é pulado
    # (não silenciosamente: o próprio docker-build-* já reprova o gate de CI
    # obrigatório da PR, ver CLAUDE.md "CI — Gate de imagens Docker") em vez
    # de tentar rodar contra uma imagem inexistente/desatualizada (issue #203).
    if: |
      always() &&
      needs.changes.result == 'success' &&
      github.event.pull_request.draft != true &&
      (needs.docker-build-rust.result == 'success' || needs.docker-build-rust.result == 'skipped') &&
      (needs.docker-build-java.result == 'success' || needs.docker-build-java.result == 'skipped') &&
      (needs.docker-build-frontend.result == 'success' || needs.docker-build-frontend.result == 'skipped') &&
      (needs.docker-build-python.result == 'success' || needs.docker-build-python.result == 'skipped') &&
      (
        needs.changes.outputs.rust == 'true' ||
        needs.changes.outputs.java == 'true' ||
        needs.changes.outputs.python == 'true' ||
        needs.changes.outputs.e2e == 'true'
      )
    permissions:
      contents: read
      packages: read
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Suíte migrada de node:test/npm para deno test (issue #199) — sem
      # depender de `npm ci`/node_modules na raiz para rodar a suíte E2E.
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Prepare .env for CI (mock LLM providers, no GCP credentials required)
        run: |
          set -euo pipefail
          echo '{}' > /tmp/ci-fake-adc.json
          cp .env.example .env
          {
            echo "EMBEDDING_PROVIDER=mock"
            echo "LLM_PROVIDER=mock"
            echo "CREW_WORKER_MODE=mock"
            echo "ADC_PATH=/tmp/ci-fake-adc.json"
          } >> .env

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Resolve, por serviço, a tag da imagem já publicada pelos jobs
      # docker-build-* (issue #203): tag do SHA atual se o módulo do serviço
      # mudou neste push/PR (a imagem foi de fato publicada agora), ou
      # ":latest" (última imagem publicada a partir de push em main/master/
      # develop) caso contrário — fail-safe simétrico ao já usado no job
      # `changes` (#77/#87). Os 4 serviços Rust (matrix docker-build-rust)
      # compartilham um único filtro de path (`rust`, não há filtro por
      # microsserviço) e por isso resolvem juntos.
      - name: Resolver tags de imagem (fail-safe SHA-ou-latest)
        run: |
          set -euo pipefail
          resolve() {
            local changed="$1" service="$2"
            if [ "$changed" = "true" ]; then
              echo "${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}/${service}:${{ github.sha }}"
            else
              echo "${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}/${service}:latest"
            fi
          }
          {
            echo "CORE_IMAGE=$(resolve '${{ needs.changes.outputs.java }}' java-core)"
            echo "EMBEDDING_SERVICE_IMAGE=$(resolve '${{ needs.changes.outputs.rust }}' embedding-service)"
            echo "INGESTION_WORKER_IMAGE=$(resolve '${{ needs.changes.outputs.rust }}' ingestion-worker)"
            echo "RAG_WORKER_IMAGE=$(resolve '${{ needs.changes.outputs.rust }}' rag-worker)"
            echo "WORKFLOW_WORKER_IMAGE=$(resolve '${{ needs.changes.outputs.rust }}' workflow-worker)"
            echo "CREW_WORKER_IMAGE=$(resolve '${{ needs.changes.outputs.python }}' crew-worker)"
            echo "FRONTEND_IMAGE=$(resolve '${{ needs.changes.outputs.frontend }}' frontend)"
          } >> "$GITHUB_ENV"

      # --ignore-pull-failures: bootstrap. Um serviço cujo módulo não mudou
      # neste push resolve para a tag ":latest" (ver step anterior), mas essa
      # tag só existe no GHCR depois do primeiro push bem-sucedido em
      # main/master/develop que tenha de fato alterado aquele módulo — antes
      # disso (ou para um serviço que nunca mudou desde a introdução da
      # #203), o pull falha (404/403). Sem essa flag, isso derrubaria
      # `e2e-integration` para QUALQUER PR que não tocasse todos os módulos.
      # Com a flag, o pull segue best-effort; o próximo step (`up -d`, sem
      # `--build`) builda localmente, via `docker compose`, apenas os
      # serviços cuja imagem não ficou disponível — não os 7 de uma vez.
      - name: Pull das imagens publicadas (sem rebuild)
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci-ports.yml pull \
            --ignore-pull-failures \
            postgres minio rabbitmq \
            core embedding-service ingestion-worker rag-worker workflow-worker crew-worker frontend

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # `script-executor` fica fora do GHCR (não é um dos 4 jobs
      # docker-build-* publicados pela #203). Continua buildado localmente
      # aqui, mas via buildx + cache GHA (mesmo scope=script-executor do job
      # docker-build-python-executor — reaproveita o cache já aquecido por
      # ele) em vez do build clássico implícito do `docker compose up`, que
      # não suporta cache type=gha (issue #200). `load: true` materializa a
      # imagem no daemon local sob a tag que docker-compose.ci-ports.yml
      # espera, para que o `up` seguinte não precise buildar de novo.
      - name: Build script-executor image (cache GHA)
        uses: docker/build-push-action@v6
        with:
          context: ./python-services/crew-worker
          file: ./python-services/crew-worker/Dockerfile.executor
          tags: local/script-executor:ci
          push: false
          load: true
          cache-from: type=gha,scope=script-executor
          # Export só em push (ver docker-build-rust): cache de PR é
          # escopado ao merge ref e inutilizável fora dele.
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=script-executor' || '' }}

      # --wait: espera os serviços com healthcheck ficarem "healthy" (não só
      # "running") e os sem healthcheck alcançarem "running" — substitui o
      # sleep fixo + loop manual de `docker inspect` (issue #200). Se algum
      # container sair/crashar durante a espera, `up --wait` falha o step
      # imediatamente, cobrindo o mesmo caso de crash-loop que o loop manual
      # verificava.
      - name: Start full stack (imagens publicadas + script-executor local, sem rebuild dos demais)
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci-ports.yml up -d --wait --wait-timeout 300 \
            postgres minio rabbitmq \
            core embedding-service ingestion-worker rag-worker workflow-worker crew-worker \
            script-executor \
            frontend

      - name: Sidecar script-executor — isolamento de kernel (issue #148)
        run: |
          set -euo pipefail
          # Prova de contenção MESMO com a allowlist de AST hipoteticamente burlada:
          # ALLOW_UNVALIDATED_SCRIPT=1 (flag EXCLUSIVO de teste — nunca em produção)
          # pula a validação de AST, de modo que os scripts crus da verificação
          # chegam ao processo isolado. A contenção que os segura vem exclusivamente
          # do endurecimento do sidecar: rede `internal` (sem rota até outros
          # serviços nem à internet) e ausência de credenciais montadas.
          #
          # O script roda DENTRO do container via `python -` lendo de stdin;
          # PYTHONPATH=/app/src permite importar o motor no processo do `exec`.
          docker compose -f docker-compose.yml -f docker-compose.ci-ports.yml \
            exec -T -e ALLOW_UNVALIDATED_SCRIPT=1 -e PYTHONPATH=/app/src \
            script-executor python - < tests/e2e/sidecar_isolation_check.py

      - name: Sidecar script-executor — confirmar ausência de credenciais e rootfs read-only
        run: |
          set -euo pipefail
          # Confirma, fora do motor de execução, que o arquivo de credenciais não
          # existe no container do sidecar.
          if docker compose -f docker-compose.yml -f docker-compose.ci-ports.yml \
               exec -T script-executor test -e /gcloud/adc.json; then
            echo "::error::/gcloud/adc.json presente no sidecar — credenciais NÃO deveriam estar montadas"
            exit 1
          fi
          echo "OK: /gcloud/adc.json ausente no sidecar"
          # Confirma rootfs read-only (escrita fora do tmpfs deve falhar).
          if docker compose -f docker-compose.yml -f docker-compose.ci-ports.yml \
               exec -T script-executor sh -c 'echo x > /root_write_probe 2>/dev/null'; then
            echo "::error::rootfs do sidecar é gravável — deveria ser read-only"
            exit 1
          fi
          echo "OK: rootfs read-only (escrita fora do tmpfs bloqueada)"

      - name: Run E2E integration suite (mock LLM)
        env:
          SKIP_RESET: "true"
          # .env.example define NEXT_PUBLIC_BACKEND_URL=http://localhost:8000,
          # que é a porta do embedding-service, não do core (Spring Boot, porta
          # 8080). tests/e2e/config.js só preenche uma chave do .env se ela
          # ainda não estiver em process.env, então essa env var aqui tem
          # prioridade sobre a linha (incorreta) do .env.example sem precisar
          # editar esse arquivo compartilhado.
          NEXT_PUBLIC_BACKEND_URL: http://localhost:8080
        run: deno test -A --node-modules-dir=none tests/e2e/

      - name: Dump container logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci-ports.yml logs --tail=200
          docker compose -f docker-compose.yml -f docker-compose.ci-ports.yml logs --no-color > /tmp/e2e-compose-logs.txt

      # Log completo (não só os últimos 200 do console, que somem quando o
      # job expira) como artefato baixável e pesquisável (issue #200).
      - name: Upload compose logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-integration-compose-logs
          path: /tmp/e2e-compose-logs.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Tear down stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci-ports.yml down -v
