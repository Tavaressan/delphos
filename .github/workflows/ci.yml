name: CI Pipeline

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.normalize.outputs.rust }}
      java: ${{ steps.normalize.outputs.java }}
      frontend: ${{ steps.normalize.outputs.frontend }}
      python: ${{ steps.normalize.outputs.python }}
      e2e: ${{ steps.normalize.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Necessário para o dorny/paths-filter conseguir calcular o
          # merge-base contra `base` em eventos push (long-lived branches).
          fetch-depth: 0

      # Filtro dedicado para o próprio workflow: mudanças em ci.yml não
      # devem ser listadas dentro de cada filtro de módulo (o que os
      # tornava auto-referentes), e sim combinadas via `||` no step de
      # normalização abaixo. Ver issue #77.
      - uses: dorny/paths-filter@v3
        id: filter
        # Nunca deixe uma falha de cálculo de diff no paths-filter
        # derrubar o job silenciosamente (issue #87) — o step de
        # normalização abaixo trata esse caso como fail-safe (roda tudo).
        continue-on-error: true
        with:
          # Base explícita para eventos push: quando `base` é o mesmo
          # branch que disparou o push, o paths-filter compara contra o
          # commit mais recente do mesmo branch antes do push (padrão
          # "long-lived branch" documentado pela action). Ignorado em
          # eventos pull_request (usa o branch base do PR automaticamente).
          base: ${{ github.ref_name }}
          filters: |
            ci_workflow:
              - '.github/workflows/ci.yml'
            rust:
              - 'rust-services/**'
            java:
              - 'java-core/**'
            frontend:
              - 'frontend/**'
            python:
              - 'python-services/**'
            # Cobre a própria suíte E2E e os arquivos que o job
            # e2e-integration usa diretamente — sem isso, uma mudança que só
            # toca tests/e2e/** (ex.: novos cenários) faz rust/java/frontend/
            # python ficarem todos 'false' e o job que deveria validar
            # justamente essa mudança é pulado (achado ao mesclar a PR #122).
            e2e:
              - 'tests/e2e/**'
              - 'docker-compose.yml'
              - 'docker-compose.ci-ports.yml'
              - 'scripts/reset.sh'
              - 'scripts/setup.sh'

      - name: Normalize filter outputs (fail-safe)
        id: normalize
        if: always()
        env:
          OUTCOME: ${{ steps.filter.outcome }}
          CI_WORKFLOW: ${{ steps.filter.outputs.ci_workflow }}
          F_RUST: ${{ steps.filter.outputs.rust }}
          F_JAVA: ${{ steps.filter.outputs.java }}
          F_FRONTEND: ${{ steps.filter.outputs.frontend }}
          F_PYTHON: ${{ steps.filter.outputs.python }}
          F_E2E: ${{ steps.filter.outputs.e2e }}
        run: |
          set -euo pipefail
          # Fail-safe: se o paths-filter falhou ou não conseguiu calcular o
          # diff, NUNCA pule checks silenciosamente — rode todos os
          # módulos por padrão (issue #87).
          if [ "$OUTCOME" != "success" ]; then
            echo "::warning::dorny/paths-filter falhou (outcome=$OUTCOME) - failing safe: rodando TODOS os módulos"
            echo "rust=true" >> "$GITHUB_OUTPUT"
            echo "java=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "python=true" >> "$GITHUB_OUTPUT"
            echo "e2e=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Mudança no próprio workflow: roda todos os módulos para
          # validar o novo pipeline de ponta a ponta.
          if [ "$CI_WORKFLOW" = "true" ]; then
            echo "::notice::ci.yml alterado - rodando todos os módulos"
            echo "rust=true" >> "$GITHUB_OUTPUT"
            echo "java=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "python=true" >> "$GITHUB_OUTPUT"
            echo "e2e=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "rust=$F_RUST" >> "$GITHUB_OUTPUT"
          echo "java=$F_JAVA" >> "$GITHUB_OUTPUT"
          echo "frontend=$F_FRONTEND" >> "$GITHUB_OUTPUT"
          echo "python=$F_PYTHON" >> "$GITHUB_OUTPUT"
          echo "e2e=$F_E2E" >> "$GITHUB_OUTPUT"

      - name: Sanity check filter outputs
        if: always()
        run: |
          set -euo pipefail
          echo "Outcome do paths-filter: ${{ steps.filter.outcome }}"
          echo "rust=${{ steps.normalize.outputs.rust }}"
          echo "java=${{ steps.normalize.outputs.java }}"
          echo "frontend=${{ steps.normalize.outputs.frontend }}"
          echo "python=${{ steps.normalize.outputs.python }}"
          echo "e2e=${{ steps.normalize.outputs.e2e }}"
          if [ -z "${{ steps.normalize.outputs.rust }}" ] || \
             [ -z "${{ steps.normalize.outputs.java }}" ] || \
             [ -z "${{ steps.normalize.outputs.frontend }}" ] || \
             [ -z "${{ steps.normalize.outputs.python }}" ] || \
             [ -z "${{ steps.normalize.outputs.e2e }}" ]; then
            echo "::error::Um ou mais outputs do filtro de paths estão vazios - normalize step com bug"
            exit 1
          fi

  rust-check:
    name: Rust Check, Lint, Format & Test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust-services -> rust-services/target"
          cache-all-crates: "true"
          shared-key: "stable"

      - name: Check Formatting (cargo fmt)
        run: |
          cd rust-services
          cargo fmt --all -- --check

      - name: Check Code (cargo check)
        run: |
          cd rust-services
          cargo check --workspace

      - name: Run Linter (cargo clippy)
        run: |
          cd rust-services
          cargo clippy --workspace -- -D warnings

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Run Tests (cargo nextest)
        run: |
          cd rust-services
          cargo nextest run --workspace

  java-check:
    name: Java Core Build & Test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.java == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Compile with Gradle
        run: |
          cd java-core
          chmod +x gradlew
          ./gradlew compileJava compileTestJava bootJar

      - name: Test with Gradle
        run: |
          cd java-core
          ./gradlew test

      - name: Verify migrations in JAR
        run: |
          cd java-core
          jar tf build/libs/*.jar | grep "db/migration/V" || (echo "❌ Flyway migrations not found in JAR" && exit 1)

  java-integration:
    name: Java Core Integration Tests (BDD)
    runs-on: ubuntu-latest
    needs: [changes, java-check]
    if: needs.changes.outputs.java == 'true'
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Run Integration Tests
        run: |
          cd java-core
          chmod +x gradlew
          ./gradlew integrationTest

  frontend-check:
    name: Frontend Lint, Test & Build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # Runner dos testes do frontend (issue #187, Fase 1). Lint e build do
      # Next seguem sob Node até a Fase 2.
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Next.js Cache
        uses: actions/cache@v4
        with:
          path: |
            frontend/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('frontend/package-lock.json') }}-${{ hashFiles('frontend/src/**/*.[jt]s', 'frontend/src/**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('frontend/package-lock.json') }}-

      - name: Run Lint
        run: |
          cd frontend
          npm run lint

      - name: Run Tests
        run: |
          cd frontend
          npm test

      - name: Build next
        run: |
          cd frontend
          npm run build

  python-ci:
    name: Python Lint & Test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.python == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'python-services/crew-worker/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f python-services/crew-worker/requirements.txt ]; then
            pip install -r python-services/crew-worker/requirements.txt
          fi
          pip install black flake8 pytest

      - name: Run Linter (Flake8)
        run: |
          flake8 python-services --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 python-services --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Check Code Formatting (Black)
        run: |
          black --check --diff python-services || echo "::warning::Formatação Black divergente — rode 'black python-services' localmente antes do próximo PR."

      - name: Run Tests (PyTest)
        run: |
          pytest python-services --ignore=python-services/crew-worker/.venv || [ $? -eq 5 ]

  # Jobs de build de imagem Docker (issue #86). Rodam em paralelo aos
  # builds/testes nativos acima (needs: changes, nunca needs: <job nativo>)
  # e são escopados pelo mesmo path-filter corrigido em #77/#87 — não
  # substituem os builds nativos, apenas validam que a imagem também builda.
  docker-build-rust:
    name: Docker Build (Rust services)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      matrix:
        service:
          - embedding-service
          - ingestion-worker
          - rag-worker
          - workflow-worker
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: ./rust-services
          file: ./rust-services/${{ matrix.service }}/Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  docker-build-java:
    name: Docker Build (Java core)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.java == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build java-core image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./java-core/Dockerfile
          push: false
          cache-from: type=gha,scope=java-core
          cache-to: type=gha,mode=max,scope=java-core

  docker-build-frontend:
    name: Docker Build (Frontend)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend/Dockerfile
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  docker-build-python:
    name: Docker Build (Crew worker)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.python == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build crew-worker image
        uses: docker/build-push-action@v6
        with:
          context: ./python-services/crew-worker
          file: ./python-services/crew-worker/Dockerfile
          push: false
          cache-from: type=gha,scope=crew-worker
          cache-to: type=gha,mode=max,scope=crew-worker

  # Imagem do sidecar de execução isolada de scripts (issue #148). Mesmo path-filter
  # `python` do job `changes` e mesma política de gate dos demais docker-build-*.
  docker-build-python-executor:
    name: Docker Build (Script executor sidecar)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.python == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build script-executor image
        uses: docker/build-push-action@v6
        with:
          context: ./python-services/crew-worker
          file: ./python-services/crew-worker/Dockerfile.executor
          push: false
          cache-from: type=gha,scope=script-executor
          cache-to: type=gha,mode=max,scope=script-executor

  # Job de integração cross-container (issue interna: gate de mock LLM no CI).
  # Diferente dos jobs docker-build-*, que só validam que cada imagem builda
  # isoladamente, este job sobe a stack inteira via docker-compose (usando
  # `-f docker-compose.yml` explícito para NÃO mesclar o
  # docker-compose.override.yml, que força EMBEDDING_PROVIDER=real para dev
  # local) e roda a suíte E2E (tests/e2e/runner.test.js) contra os containers
  # reais se comunicando entre si. LLM_PROVIDER=mock e EMBEDDING_PROVIDER=mock
  # evitam qualquer chamada de rede à Vertex AI — só a orquestração via
  # RabbitMQ, a busca vetorial no pgvector e o HTTP entre serviços são reais.
  # Roda sempre que qualquer módulo mudar (mesmo path-filter do job `changes`)
  # porque uma regressão de integração pode vir de qualquer serviço, e também
  # quando a própria suíte E2E (ou os arquivos docker-compose/scripts que ela
  # usa) mudar — sem o filtro `e2e`, uma PR que só adiciona/ajusta cenários em
  # tests/e2e/** nunca disparava este job (achado ao mesclar a PR #122).
  e2e-integration:
    name: Integration E2E (Docker Compose + Mock LLM)
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.rust == 'true' ||
      needs.changes.outputs.java == 'true' ||
      needs.changes.outputs.python == 'true' ||
      needs.changes.outputs.e2e == 'true'
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies (E2E test runner)
        run: npm ci

      - name: Prepare .env for CI (mock LLM providers, no GCP credentials required)
        run: |
          set -euo pipefail
          echo '{}' > /tmp/ci-fake-adc.json
          cp .env.example .env
          {
            echo "EMBEDDING_PROVIDER=mock"
            echo "LLM_PROVIDER=mock"
            echo "CREW_WORKER_MODE=mock"
            echo "ADC_PATH=/tmp/ci-fake-adc.json"
          } >> .env

      - name: Build and start full stack (docker-compose.yml + portas de CI, sem override de dev)
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci-ports.yml up -d --build \
            postgres redis minio rabbitmq \
            core embedding-service ingestion-worker rag-worker workflow-worker crew-worker \
            script-executor \
            frontend

      - name: Verificar que os workers assíncronos subiram e não entraram em crash-loop
        run: |
          set -euo pipefail
          sleep 15
          for name in ingestion_worker rag_worker workflow_worker crew_worker script_executor; do
            status=$(docker inspect --format '{{.State.Status}}' "$name")
            echo "Container $name: status=$status"
            if [ "$status" != "running" ]; then
              echo "::error::Container $name não está 'running' (status=$status)"
              docker logs "$name" --tail 100 || true
              exit 1
            fi
          done

      - name: Sidecar script-executor — isolamento de kernel (issue #148)
        run: |
          set -euo pipefail
          # Prova de contenção MESMO com a allowlist de AST hipoteticamente burlada:
          # ALLOW_UNVALIDATED_SCRIPT=1 (flag EXCLUSIVO de teste — nunca em produção)
          # pula a validação de AST, de modo que os scripts crus da verificação
          # chegam ao processo isolado. A contenção que os segura vem exclusivamente
          # do endurecimento do sidecar: rede `internal` (sem rota até outros
          # serviços nem à internet) e ausência de credenciais montadas.
          #
          # O script roda DENTRO do container via `python -` lendo de stdin;
          # PYTHONPATH=/app/src permite importar o motor no processo do `exec`.
          docker compose -f docker-compose.yml -f docker-compose.ci-ports.yml \
            exec -T -e ALLOW_UNVALIDATED_SCRIPT=1 -e PYTHONPATH=/app/src \
            script-executor python - < tests/e2e/sidecar_isolation_check.py

      - name: Sidecar script-executor — confirmar ausência de credenciais e rootfs read-only
        run: |
          set -euo pipefail
          # Confirma, fora do motor de execução, que o arquivo de credenciais não
          # existe no container do sidecar.
          if docker compose -f docker-compose.yml -f docker-compose.ci-ports.yml \
               exec -T script-executor test -e /gcloud/adc.json; then
            echo "::error::/gcloud/adc.json presente no sidecar — credenciais NÃO deveriam estar montadas"
            exit 1
          fi
          echo "OK: /gcloud/adc.json ausente no sidecar"
          # Confirma rootfs read-only (escrita fora do tmpfs deve falhar).
          if docker compose -f docker-compose.yml -f docker-compose.ci-ports.yml \
               exec -T script-executor sh -c 'echo x > /root_write_probe 2>/dev/null'; then
            echo "::error::rootfs do sidecar é gravável — deveria ser read-only"
            exit 1
          fi
          echo "OK: rootfs read-only (escrita fora do tmpfs bloqueada)"

      - name: Run E2E integration suite (mock LLM)
        env:
          SKIP_RESET: "true"
          # .env.example define NEXT_PUBLIC_BACKEND_URL=http://localhost:8000,
          # que é a porta do embedding-service, não do core (Spring Boot, porta
          # 8080). tests/e2e/config.js só preenche uma chave do .env se ela
          # ainda não estiver em process.env, então essa env var aqui tem
          # prioridade sobre a linha (incorreta) do .env.example sem precisar
          # editar esse arquivo compartilhado.
          NEXT_PUBLIC_BACKEND_URL: http://localhost:8080
        run: npm run test:e2e

      - name: Dump container logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.ci-ports.yml logs --tail=200

      - name: Tear down stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci-ports.yml down -v
