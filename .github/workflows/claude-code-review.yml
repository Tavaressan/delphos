name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Só dispara para mudanças com probabilidade real de bug — código-fonte,
    # pipeline de CI e infra de containers. PRs que só tocam docs, manifestos
    # de dependência isolados (ex.: dependabot.yml) ou _reversa_sdd/ ficam de
    # fora e não custam a revisão do agente.
    paths:
      - "frontend/**"
      - "java-core/**"
      - "rust-services/**"
      - "python-services/**"
      - ".github/workflows/**"
      - "docker-compose*.yml"

jobs:
  claude-review:
    # Pula PRs de bots (ex.: Dependabot) — bumps mecânicos de versão já são
    # cobertos pelos testes nativos de CI; e pula pushes em PRs ainda em
    # rascunho, para não custar a cada iteração de WIP (ready_for_review já
    # dispara a revisão assim que sai do rascunho).
    if: |
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.draft == false

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

