# Docker Compose for Corporate IA/RAG Platform

version: "3.9"

services:
  postgres:
    image: ankane/pgvector:latest
    container_name: rag_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-rag_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rag_redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: rag_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5

  core:
    build:
      context: .
      dockerfile: java-core/Dockerfile
    container_name: core-platform
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rag_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "check_running" ]
      interval: 10s
      timeout: 5s
      retries: 5

  #  structurizr:
  #    image: structurizr/structurizr
  #    container_name: structurizr
  #    command: local
  #    ports:
  #      - "8081:8080"
  #    volumes:
  #      - ./docs/architecture:/usr/local/structurizr
  #    healthcheck:
  #      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
  #      interval: 30s
  #      timeout: 10s
  #      retries: 3

  embedding-service:
    build:
      context: ./rust-services
      dockerfile: embedding-service/Dockerfile
    container_name: embedding_service
    env_file:
      - .env
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials/gcp-key.json
    volumes:
      - ${GOOGLE_APPLICATION_CREDENTIALS}:/app/credentials/gcp-key.json
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/healthz" ]
      interval: 10s
      timeout: 5s
      retries: 5

  ingestion-worker:
    build:
      context: ./rust-services
      dockerfile: ingestion-worker/Dockerfile
    container_name: ingestion_worker
    env_file:
      - .env
    depends_on:
      core:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      embedding-service:
        condition: service_healthy

  rag-worker:
    build:
      context: ./rust-services
      dockerfile: rag-worker/Dockerfile
    container_name: rag_worker
    env_file:
      - .env
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials/gcp-key.json
    volumes:
      - ${GOOGLE_APPLICATION_CREDENTIALS}:/app/credentials/gcp-key.json
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      embedding-service:
        condition: service_healthy

  workflow-worker:
    build:
      context: ./rust-services
      dockerfile: workflow-worker/Dockerfile
    container_name: workflow_worker
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/rag_db
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
    env_file:
      - .env
    depends_on:
      core:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  crew-worker:
    build:
      context: ./python-services/crew-worker
      dockerfile: Dockerfile
    container_name: crew_worker
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials/gcp-key.json
    volumes:
      - ${GOOGLE_APPLICATION_CREDENTIALS}:/app/credentials/gcp-key.json
    depends_on:
      core:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rag_frontend
    env_file:
      - .env
    depends_on:
      core:
        condition: service_healthy
    command: npm run dev
    healthcheck:
      test: [ "CMD", "node", "-e", "fetch('http://localhost:3000').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))" ]
      interval: 30s
      timeout: 10s
      retries: 3

  caddy:
    build:
      context: ./infrastructure/caddy
      dockerfile: Dockerfile
    container_name: rag_caddy
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
  minio_data:
  rabbitmq_data:
