# Docker Compose for Corporate IA/RAG Platform

version: "3.9"

services:
  postgres:
    image: ankane/pgvector:latest
    container_name: rag_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-rag_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  minio:
    image: minio/minio:latest
    container_name: rag_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  core:
    build:
      context: ./java-core
      dockerfile: Dockerfile
    container_name: core-platform
    volumes:
      - .:/app
      - /app/java-core/.gradle     # Evita que o cache do gradle do container brigue com o do Windows
      - /app/java-core/build       # Protege a pasta de artefatos Java
    env_file:
      - .env
    environment:
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://alfabra-vector.vercel.app,https://*.vercel.app,http://localhost:[*]}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rag_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "check_running" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  #  structurizr:
  #    image: structurizr/structurizr
  #    container_name: structurizr
  #    command: local
  #    ports:
  #      - "8081:8080"
  #    volumes:
  #      - ./docs/architecture:/usr/local/structurizr
  #    healthcheck:
  #      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
  #      interval: 30s
  #      timeout: 10s
  #      retries: 3

  embedding-service:
    build:
      context: ./rust-services
      dockerfile: embedding-service/Dockerfile
    container_name: embedding_service
    env_file:
      - .env
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/gcloud/adc.json
    volumes:
      - ./rust-services:/app
      - /app/target                # Protege o cache de compilação do Rust no Linux
      - ${ADC_PATH}:/gcloud/adc.json:ro
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/healthz" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  ingestion-worker:
    build:
      context: ./rust-services
      dockerfile: ingestion-worker/Dockerfile
    container_name: ingestion_worker
    restart: on-failure
    env_file:
      - .env
    # Chunking configurável via .env — omitir para usar defaults (1000/200)
    # CHUNK_SIZE=1000  CHUNK_OVERLAP=200
    volumes:
      - ./rust-services:/app
      - /app/target                # Protege o cache de compilação do Rust no Linux
    depends_on:
      core:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      embedding-service:
        condition: service_healthy

  rag-worker:
    build:
      context: ./rust-services
      dockerfile: rag-worker/Dockerfile
    container_name: rag_worker
    restart: on-failure
    env_file:
      - .env
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/gcloud/adc.json
    volumes:
      - ./rust-services:/app
      - /app/target                # Protege o cache de compilação do Rust no Linux
      - ${ADC_PATH}:/gcloud/adc.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      embedding-service:
        condition: service_healthy

  workflow-worker:
    build:
      context: ./rust-services
      dockerfile: workflow-worker/Dockerfile
    container_name: workflow_worker
    restart: on-failure
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/rag_db
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
    env_file:
      - .env
    volumes:
      - ./rust-services:/app
      - /app/target                # Protege o cache de compilação do Rust no Linux
    depends_on:
      core:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  crew-worker:
    build:
      context: ./python-services/crew-worker
      dockerfile: Dockerfile
    container_name: crew_worker
    restart: on-failure
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - GOOGLE_APPLICATION_CREDENTIALS=/gcloud/adc.json
      # Roteia a execução de scripts gerados por LLM para o sidecar endurecido
      # `script-executor` (issue #148). Sem esta env var, o crew-worker cai no
      # fallback in-process (usado só em dev/testes unitários sem Docker).
      - SCRIPT_EXECUTOR_URL=http://script-executor:8000/run
    volumes:
      - ${ADC_PATH}:/gcloud/adc.json:ro
    networks:
      # Rede default: alcança core, rabbitmq, embedding-service etc.
      - default
      # Rede internal dedicada: única rota até o sidecar script-executor.
      - sandbox_net
    depends_on:
      core:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      script-executor:
        condition: service_healthy

  # Sidecar dedicado à execução isolada de scripts Python gerados por LLM
  # (issue #148). Endurecido: SEM credenciais GCP (nenhum adc.json montado, sem
  # GOOGLE_APPLICATION_CREDENTIALS), SEM egress de rede (só na rede `sandbox_net`,
  # marcada como `internal`), rootfs read-only, tmpfs efêmero (zerado por execução)
  # como único ponto gravável, todas as capabilities dropadas e escalonamento de
  # privilégio bloqueado. gVisor (`runtime: runsc`) é OPCIONAL e documentado na
  # decisão SDD, NÃO habilitado por default.
  script-executor:
    build:
      context: ./python-services/crew-worker
      dockerfile: Dockerfile.executor
    container_name: script_executor
    restart: on-failure
    environment:
      - PYTHONUNBUFFERED=1
      - SCRIPT_EXECUTOR_PORT=8000
    read_only: true
    tmpfs:
      # Único ponto de escrita: workdir efêmero das execuções (TemporaryDirectory).
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    pids_limit: 128
    mem_limit: 256m
    networks:
      - sandbox_net
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=2).status == 200 else 1)" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Provider local de embeddings e chat (issue #358): redundância além dos providers
  # Google (Vertex AI / AI Studio) e camada de teste com semântica real, substituindo o
  # mock hoje usado no E2E. Fora do profile default: o pull dos modelos é de vários GB e
  # não deve penalizar quem só quer subir a stack. Suba com:
  #   docker compose --profile local-ai up -d
  # e baixe um modelo antes do primeiro uso, ex.:
  #   docker compose --profile local-ai exec ollama ollama pull nomic-embed-text
  #   docker compose --profile local-ai exec ollama ollama pull llama3.2
  ollama:
    image: ollama/ollama:latest
    container_name: rag_ollama
    profiles:
      - local-ai
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: [ "CMD", "ollama", "list" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: rag_frontend
    volumes:
      - .:/app
      # O Deno materializa as deps em /app/node_modules (raiz do workspace, onde
      # está o deno.json) e também em frontend/node_modules. Os dois precisam ficar
      # fora do bind mount: copiar binários .node para dentro dele falha com EIO.
      - /app/node_modules
      - /app/frontend/node_modules
      - /app/frontend/.next
    env_file:
      - .env
    environment:
      - WATCHPACK_POLLING=true
    depends_on:
      core:
        condition: service_healthy
    # O WORKDIR da imagem ja e /app/frontend
    command: deno task dev
    healthcheck:
      test: [ "CMD", "deno", "eval", "const r = await fetch('http://localhost:3000'); if (!r.ok) Deno.exit(1)" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  caddy:
    build:
      context: ./infrastructure/caddy
      dockerfile: Dockerfile
    container_name: rag_caddy
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy

networks:
  # Rede isolada do sidecar de execução de scripts (issue #148). `internal: true`
  # remove o gateway default (sem NAT/egress): o script-executor não alcança a
  # internet nem os demais serviços da rede default, e nenhum serviço fora desta
  # rede o alcança — só o crew-worker, que participa das duas redes.
  sandbox_net:
    internal: true

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  minio_data:
  rabbitmq_data:
  ollama_data:
