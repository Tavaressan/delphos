# Render Blueprint Specification for Alfabra Vector - POC Service (rag-worker)
# Reference for Issue #240: Render Free Tier POC Deploy

services:
  # Web service wrapper for rag-worker (exposes HTTP health endpoint to satisfy Render Free Web Service requirement)
  - type: web
    name: rag-worker-poc
    env: docker
    dockerContext: ./rust-services
    dockerfilePath: ./rust-services/rag-worker/Dockerfile
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: RUST_LOG
        value: info
      - key: DATABASE_URL
        fromDatabase:
          name: rag-postgres-poc
          property: connectionString
      - key: RABBITMQ_URL
        sync: false # Set manually to CloudAMQP Little Lemur URI

databases:
  # PostgreSQL instance with pgvector extension support
  - name: rag-postgres-poc
    plan: free # Note: Expires 30 days after creation
    databaseName: rag_db
    user: postgres
