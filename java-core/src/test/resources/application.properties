# Em testes o Flyway já cria o schema; desativa validate do Hibernate
# porque o tipo pgvector (vector) não é reconhecido pelo validador do Hibernate
spring.jpa.hibernate.ddl-auto=none

# Impede que @RabbitListener tente conectar ao broker durante testes de integração;
# RabbitTemplate é mockado via @MockitoBean em CucumberSpringConfiguration
spring.rabbitmq.listener.simple.auto-startup=false
spring.rabbitmq.host=localhost
spring.rabbitmq.port=9999
