# Spring Boot configuration for Corporate IA/RAG Platform
spring:
  application:
    name: core-platform

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:postgres}:${POSTGRES_PORT:5432}/${POSTGRES_DB:rag_db}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate  # Safety measure: let Flyway manage all schema mutations
    properties:
      hibernate:
        format_sql: true
        show_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    placeholders:
      "embedding.dimension": ${EMBEDDING_DIMENSIONS:768}

  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}

  servlet:
    multipart:
      # AgentService aceita pacotes ZIP com até 20MB descompactados (ver AgentService#parseZip);
      # o limite aqui precisa ser maior que isso para o request nem chegar a ser rejeitado antes
      # de alcançar essa validação (ver issue #110).
      max-file-size: ${AGENT_UPLOAD_MAX_FILE_SIZE:25MB}
      max-request-size: ${AGENT_UPLOAD_MAX_REQUEST_SIZE:25MB}

server:
  port: 8080

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://alfabra-vector.vercel.app,https://*.vercel.app,http://localhost:[*]}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics

minio:
  url: ${MINIO_URL:http://minio:9000}
  access-key: ${MINIO_ROOT_USER:minioadmin}
  secret-key: ${MINIO_ROOT_PASSWORD:minioadmin}
  bucket: ${MINIO_BUCKET:agents-data}

