repos:
  - repo: local
    hooks:

      - id: rust-fmt
        name: Rust Format
        # Parâmetro oficial do Cargo para mapear subpastas sem depender de shell
        entry: cargo fmt --manifest-path rust-services/Cargo.toml --all -- --check
        language: system
        pass_filenames: false

      - id: rust-clippy
        name: Rust Clippy
        entry: cargo clippy --manifest-path rust-services/Cargo.toml -- -D warnings
        language: system
        pass_filenames: false

      - id: frontend-lint
        name: Frontend Lint
        # Sintaxe universal de workspaces aceita por Mac, Linux e Git Bash
        entry: npm run lint -w frontend
        language: system
        pass_filenames: false
        files: '^frontend/'

      - id: frontend-types
        name: Frontend Type Check
        entry: npx -w frontend tsc --noEmit
        language: system
        pass_filenames: false
        files: '^frontend/'

      - id: gitleaks
        name: Gitleaks
        entry: gitleaks protect --staged
        language: system
        pass_filenames: false

      - id: python-black
        name: Python Format (Black)
        entry: python3 -m black python-services/
        language: system
        pass_filenames: false
        types: [python]

      - id: gradle-wrapper-check
        name: Verificar Gradle Wrapper no Git
        # Shell puro — sem dependência de Python, funciona em Git Bash, Mac e Linux
        entry: sh -c "test ! -f java-core/gradle/wrapper/gradle-wrapper.properties || test -f java-core/gradle/wrapper/gradle-wrapper.jar"
        language: system
        pass_filenames: false

      - id: flyway-migration-check
        name: Flyway Migration Checks
        # Roda apenas quando há arquivos V*.sql no staging (path, naming, duplicata, lacuna)
        entry: bash scripts/check-migrations.sh
        language: system
        pass_filenames: false
        files: 'V[0-9]+.*\.sql$'
